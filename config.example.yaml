# Call Copilot Configuration Template
# Copy this file to config.yaml and fill in your keys if using Call Copilot real-time voice features.

# === LLM PROVIDER ===
# Options: "groq" (free), "claude_bedrock" (AWS), "claude", "gemini", "openai"
llm_provider: "groq"

# AWS Bedrock (Claude via AWS)
aws_access_key_id: "YOUR_AWS_ACCESS_KEY_ID"
aws_secret_access_key: "YOUR_AWS_SECRET_ACCESS_KEY"
aws_region: "us-east-1"
bedrock_model: "anthropic.claude-3-haiku-20240307-v1:0"

# Groq (Free tier available at console.groq.com)
groq_api_key: "YOUR_GROQ_API_KEY"
groq_model: "llama-3.3-70b-versatile"

# Claude Direct (Add your key when ready)
claude_api_key: ""
claude_model: "claude-3-5-haiku-20241022"

# Gemini (Add your key when ready)
gemini_api_key: ""
gemini_model: "gemini-2.0-flash"

# OpenAI (Add your key when ready)
openai_api_key: ""
openai_model: "gpt-4o-mini"

# === SPEECH TO TEXT ===
deepgram_api_key: "YOUR_DEEPGRAM_API_KEY"
language: "en-US"
stt_model: "nova-3"

# === TIMING (pause detection) ===
utterance_end_ms: 3000
silence_trigger_sec: 3.0

# === RESPONSE SETTINGS ===
max_response_tokens: 200
temperature: 0.7

# === UI ===
overlay_width: 440
overlay_height: 580
overlay_opacity: 0.92

# === LOGGING ===
save_call_logs: true

# === COMPANY ===
company_name: "Innovate Marketers"
company_location: "Miami, FL"
services: "SEO, PPC (Google Ads), Web Design, Social Media Marketing"

# === CALLER / REP PROFILE ===
rep_name: "Shiv"
rep_full_name: "Shiv Prasad Farale"
rep_phone: "(645) 220-1660"
rep_direct_numbers: "(321) 926-4451, (786) 706-9566"
rep_extension: "105"
rep_email: "shivaprasad.farale@innovatemarketers.com"
